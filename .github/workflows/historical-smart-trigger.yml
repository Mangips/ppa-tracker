name: Historical Smart Trigger (With Progress Tracking)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date override (YYYY-MM-DD). Leave blank to resume from historical_progress.txt'
        required: false
        default: ''
      end_date:
        description: 'Last end date (YYYY-MM-DD)'
        required: true
        default: '2026-09-30'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-historical:
    runs-on: ubuntu-latest
    environment: Test
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine date range
        id: dates
        run: |
          if [ -n "${{ inputs.start_date }}" ]; then
            NEXT_START="${{ inputs.start_date }}"
          elif [ -f historical_progress.txt ]; then
            LAST_PROCESSED=$(cat historical_progress.txt)
            NEXT_START=$(date -d "$LAST_PROCESSED + 1 day" +%Y-%m-%d)
          else
            echo "::error::No start_date provided and historical_progress.txt does not exist."
            exit 1
          fi

          END_DATE="${{ inputs.end_date }}"

          if [[ "$NEXT_START" > "$END_DATE" ]]; then
            echo "::error::Start date $NEXT_START is after end date $END_DATE."
            exit 1
          fi

          WEEK_END=$(date -d "$NEXT_START +6 days" +%Y-%m-%d)

          if [[ "$WEEK_END" > "$END_DATE" ]]; then
            WEEK_END="$END_DATE"
          fi

          echo "week_start=$NEXT_START" >> "$GITHUB_OUTPUT"
          echo "week_end=$WEEK_END" >> "$GITHUB_OUTPUT"

      - name: Run one historical week
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          NOTIFY_EMAIL_ENABLED: ${{ vars.NOTIFY_EMAIL_ENABLED }}
          NOTIFY_SMTP_HOST: ${{ secrets.NOTIFY_SMTP_HOST }}
          NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          SEARCH_FROM_DATE: ${{ steps.dates.outputs.week_start }}
          SEARCH_TO_DATE: ${{ steps.dates.outputs.week_end }}
        run: python src/pipeline.py

      - name: Commit results and progress
        run: |
          git config user.name "ppa-tracker-bot"
          git config user.email "bot@ppa-tracker"

          echo "${{ steps.dates.outputs.week_end }}" > historical_progress.txt

          git add \
            data/ppa_deals.db \
            data/ppa_deals.csv \
            data/logs/ \
            historical_progress.txt

          git diff --staged --quiet || \
            git commit -m "chore: historical update ${{ steps.dates.outputs.week_start }} to ${{ steps.dates.outputs.week_end }}"

          git push
