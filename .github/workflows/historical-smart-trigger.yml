name: Historical Smart Trigger (With Progress Tracking)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date override (YYYY-MM-DD). Leave blank to resume from historical_progress.txt'
        required: false
        default: ''
      end_date:
        description: 'Last end date (YYYY-MM-DD)'
        required: true
        default: '2026-09-30'

concurrency:
  group: ppa-historical-backfill
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-historical:
    runs-on: ubuntu-latest
    environment: Test
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run historical backfill continuously
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          NOTIFY_EMAIL_ENABLED: ${{ vars.NOTIFY_EMAIL_ENABLED }}
          NOTIFY_SMTP_HOST: ${{ secrets.NOTIFY_SMTP_HOST }}
          NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: |
          set -e

          if [ -n "${{ inputs.start_date }}" ]; then
            CURRENT_START="${{ inputs.start_date }}"
          elif [ -f historical_progress.txt ]; then
            LAST_PROCESSED=$(cat historical_progress.txt)
            CURRENT_START=$(date -d "$LAST_PROCESSED +1 day" +%Y-%m-%d)
          else
            echo "::error::No start_date provided and historical_progress.txt does not exist."
            exit 1
          fi

          FINAL_END="${{ inputs.end_date }}"

          git config user.name "ppa-tracker-bot"
          git config user.email "bot@ppa-tracker"

          while [[ "$CURRENT_START" <= "$FINAL_END" ]]; do

            CURRENT_END=$(date -d "$CURRENT_START +6 days" +%Y-%m-%d)

            if [[ "$CURRENT_END" > "$FINAL_END" ]]; then
              CURRENT_END="$FINAL_END"
            fi

            echo "=================================================="
            echo "Processing week: $CURRENT_START -> $CURRENT_END"
            echo "=================================================="

            SEARCH_FROM_DATE="$CURRENT_START" \
            SEARCH_TO_DATE="$CURRENT_END" \
            python src/pipeline.py

            echo "$CURRENT_END" > historical_progress.txt

            git add \
              data/ppa_deals.db \
              data/ppa_deals.csv \
              data/logs/ \
              historical_progress.txt

            if git diff --staged --quiet; then
              echo "No changes to commit."
            else
              git commit \
                -m "chore: historical update $CURRENT_START to $CURRENT_END"

              git push
            fi

            CURRENT_START=$(date -d "$CURRENT_END +1 day" +%Y-%m-%d)

            echo "Completed week. Next start: $CURRENT_START"
          done

          echo "Historical backfill completed through $FINAL_END."
