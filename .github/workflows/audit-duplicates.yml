name: Audit Existing PPA Duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm database exists
        run: |
          if [ ! -f data/ppa_deals.db ]; then
            echo "ERROR: data/ppa_deals.db is missing from this branch."
            exit 1
          fi

      - name: Run duplicate-safety tests
        env:
          NEWSAPI_KEY: AUDIT_MODE_NO_API_CALLS
          ENVIRONMENT: AUDIT
        run: python -m unittest discover -s tests -v

      - name: Generate read-only audit reports
        env:
          NEWSAPI_KEY: AUDIT_MODE_NO_API_CALLS
          ENVIRONMENT: AUDIT
        run: python src/audit_existing_duplicates.py

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: ppa-duplicate-audit-reports
          path: |
            data/duplicate_audit/*.csv
            data/duplicate_audit/audit_summary.txt
          if-no-files-found: error
          retention-days: 14
